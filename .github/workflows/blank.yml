name: Build Documentation

on:
  push:
    branches:
      - main  # 修改为你的主分支名称

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'  # 修改为你需要的Node.js版本
          
#       - name: Install dependencies
#         run: npm ci
        
      - name: Build documentation
        run: npm run docs:build
